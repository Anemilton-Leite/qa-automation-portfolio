name: 🧪 QA Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── API Tests ────────────────────────────────────────────────────────────────
  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests — Posts
        run: node api-tests/posts.test.js

      - name: Run API Tests — Users
        run: node api-tests/users.test.js

  # ── Cypress E2E ──────────────────────────────────────────────────────────────
  cypress-tests:
    name: 🌲 Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          config-file: cypress/cypress.config.js
          browser: chrome
          headed: false

      - name: Upload Cypress Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports/
          retention-days: 7

      - name: Upload Cypress Screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/

  # ── Playwright Cross-browser ─────────────────────────────────────────────────
  playwright-tests:
    name: 🎭 Playwright Cross-browser Tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --config=playwright/playwright.config.js

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Sumário ──────────────────────────────────────────────────────────────────
  summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests, cypress-tests, playwright-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "════════════════════════════════════"
          echo "  QA AUTOMATION PIPELINE — RESULTADO"
          echo "════════════════════════════════════"
          echo "  API Tests:        ${{ needs.api-tests.result }}"
          echo "  Cypress E2E:      ${{ needs.cypress-tests.result }}"
          echo "  Playwright:       ${{ needs.playwright-tests.result }}"
          echo "════════════════════════════════════"
